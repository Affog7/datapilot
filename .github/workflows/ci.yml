name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # récupère ton code
      - uses: pnpm/action-setup@v4 # installe pnpm (version lue dans package.json)
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # Échoue si pnpm-lock.yaml ne correspond plus à package.json (au lieu de le modifier).
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
